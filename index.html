<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Magic 8-Ball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0a0e27;
            width: 100vw;
            height: 100vh;
        }

        /* Galaxy Background */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* 8-Ball Container */
        .ball-container {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            margin-bottom: 60px;
        }

        .ball-container.shaking {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) translateY(0) rotateX(0) rotateY(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px) translateY(-5px) rotateX(5deg) rotateY(-5deg); }
            20%, 40%, 60%, 80% { transform: translateX(10px) translateY(5px) rotateX(-5deg) rotateY(5deg); }
        }

        /* The 8-Ball Sphere */
        .eight-ball {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #000000);
            box-shadow: 
                inset -20px -20px 60px rgba(0, 0, 0, 0.9),
                inset 20px 20px 40px rgba(255, 255, 255, 0.1),
                0 30px 80px rgba(0, 0, 0, 0.8);
            transform-style: preserve-3d;
        }

        /* Glossy Highlight */
        .eight-ball::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 45%;
            height: 45%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), transparent 60%);
            filter: blur(10px);
            transform: translateZ(50px);
        }

        /* Specular Highlight */
        .eight-ball::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 30%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent 70%);
            filter: blur(15px);
        }

        /* Triangle Window */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(10px);
            width: 280px; 
            height: 280px; 
            background: radial-gradient(circle, #1a1a3e, #0a0a1e);
            clip-path: polygon(50% 15%, 90% 85%, 10% 85%);
            overflow: hidden;
            box-shadow: 
                inset 0 0 30px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(100, 150, 255, 0.2);
        }

        /* Water Effect Container */
        .water-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Response Text - OPTIMIZED GEOMETRY FOR ANTI-CLIPPING */
        .response-text {
            position: absolute;
            top: 62%; /* Positioned lower where the triangle base is wide enough to support width */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px; /* Constrains the horizontal line limit to force early wrapping */
            text-align: center;
            color: #64ffda;
            font-size: 11px; /* Compact, crisp font size keeps multi-line breaks contained */
            font-weight: 600;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.8);
            line-height: 1.4;
            opacity: 1; 
            transition: opacity 0.3s ease;
        }

        .response-text.animate-float {
            animation: floatUp 2.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, 40px) scale(0.8) rotate(-5deg);
                filter: blur(6px);
            }
            40% {
                opacity: 0.5;
                filter: blur(2px);
            }
            70% {
                transform: translate(-50%, -50%) translateY(-5px) scale(1.03) rotate(1deg);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(1) rotate(0deg);
                filter: blur(0px);
            }
        }

        .response-text.sway {
            animation: gentleSway 4s ease-in-out infinite;
        }

        @keyframes gentleSway {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            25% { transform: translate(-50%, -50%) translateY(-3px) rotate(0.5deg); }
            75% { transform: translate(-50%, -50%) translateY(3px) rotate(-0.5deg); }
        }

        /* Shake Button */
        .shake-button {
            position: relative;
            z-index: 20;
            padding: 18px 45px;
            font-size: 20px;
            font-weight: bold;
            color: #0a0e27;
            background: linear-gradient(135deg, #64ffda 0%, #4fc3f7 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(100, 255, 218, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            user-select: none;
        }

        .shake-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(100, 255, 218, 0.6);
            background: linear-gradient(135deg, #4fc3f7 0%, #64ffda 100%);
        }

        .shake-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .shake-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: linear-gradient(135deg, #334 0%, #445 100%);
            box-shadow: none;
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Responsive Configuration */
        @media (max-width: 768px) {
            .ball-container {
                width: 300px;
                height: 300px;
                margin-bottom: 40px;
            }

            .window {
                width: 200px; 
                height: 200px; 
            }

            .response-text {
                font-size: 9px; 
                width: 95px;
                top: 62%;
            }

            .shake-button {
                padding: 15px 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas"></canvas>

    <div class="container">
        <div class="ball-container" id="ballContainer">
            <div class="eight-ball" id="eightBall">
                <div class="window">
                    <div class="water-container">
                        <div class="response-text" id="responseText" role="status" aria-live="polite">
                            Ask a question...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="shake-button" id="shakeButton" aria-label="Shake the magic 8-ball">
            <span id="buttonText">Shake</span>
        </button>
    </div>

    <div class="sr-only" aria-live="assertive" id="srAnnounce"></div>
